<h4>Add vehicule</h4>

<form [formGroup]="formGroupCar" (ngSubmit)="addCar()">

    <div>
        <label>Brand</label>
        <br>
        <input type="text" formControlName="brand">
        @if(formGroupCar.get('brand')?.hasError('required') && formGroupCar.get('brand')?.dirty){
            <p class="font-red">La marque du véhicule est obligatoire</p>
        }
        @if(formGroupCar.get('brand')?.hasError('minlength') && formGroupCar.get('brand')?.dirty){
             <p class="font-red">La marque du véhicule doit faire au moins 3 caractères</p>
        }
    </div>

        <div>
        <label>Color</label>
        <br>
        <input type="text" formControlName="color">
    </div>

        <div>
        <label>Puissance</label>
        <br>
        <input type="number" formControlName="puissance">
    </div>

        <div>
        <label>Image</label>
        <br>
        <input type="text" formControlName="imageUrl">
    </div>

    <button type="submit">Add</button>
</form>
