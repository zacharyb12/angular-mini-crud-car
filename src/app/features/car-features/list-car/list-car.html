<h4>List vehicule</h4>

<ul class="container">

    @for (c of listCars(); track $index){
        <li class="card">
            <div class="d-flex">
                <div>
                    <h4>{{c.brand}}</h4>
                    <p>puissance : {{c.puissance}}</p>
                    <p>color : {{c.color}}</p>
                </div>
                
                <img [src]="c.imageUrl" [alt]="c.brand">
            </div>

            <div class="div-button">
                <button (click)="navigateToDetails(c.id)">Details</button>
                <button (click)="deleteCar(c.id)">Delete</button>
            </div>
        </li>
    }
</ul>
