<form [formGroup]="formUpdate" (ngSubmit)="updateCar()">

    <div>
        <label>Color</label>
        <br>
        <input type="text" formControlName="color">
    </div>

        <div>
        <label>Puissance</label>
        <br>
        <input type="text" formControlName="puissance">
    </div>

        <div>
        <label>Image</label>
        <br>
        <input type="text" formControlName="imageUrl">
    </div>

    <button type="submit">Update</button>
</form>
